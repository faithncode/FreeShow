name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Windows Installer (.exe)
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build frontend and electron
        run: npm run build

      - name: Remove Azure Code Signing config
        shell: bash
        run: |
          node -e "const fs = require('fs'); const file = 'config/building/electron-builder.yaml'; let content = fs.readFileSync(file, 'utf8'); content = content.replace(/azureSignOptions:[\s\S]*?(?=\n\w|\n#|$)/g, ''); fs.writeFileSync(file, content);"

      - name: Package Windows Installer (.exe)
        run: npx electron-builder --win --x64 --config config/building/electron-builder.yaml --publish never

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeShow-Windows-x64
          path: dist/*.exe
